name: CI

# All logic lives in ci-pipeline.fsx (Fun.Build). This file only starts it and installs the SDKs.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v4
      with:
        # 10.0.1xx satisfies global.json; 11.0.x supplies the .NET 11 runtime.
        dotnet-version: |
          10.0.1xx
          11.0.x
        dotnet-quality: 'preview'
    - run: dotnet fsi ci-pipeline.fsx
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
